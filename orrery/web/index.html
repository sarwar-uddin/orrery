<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Orrery 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #040405; }
  body { font-family: "Oxygen", "Noto Sans", sans-serif; color: #fff; user-select: none; }
  #scene, #scene canvas { position: absolute; inset: 0; display: block; }
  .labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  .label {
    font-size: 11px; color: rgba(255, 255, 255, 0.5); white-space: nowrap;
    padding: 1px 4px; border-radius: 3px; cursor: pointer; pointer-events: auto;
    text-shadow: 0 0 3px #000, 0 0 6px #000; transform: translateY(-50%);
    transition: color 120ms;
  }
  .label.up { color: rgba(255, 255, 255, 0.88); }
  .label:hover { color: #fff; background: rgba(255, 255, 255, 0.08); }
  .label.selected { color: var(--accent, #e74c3c); font-weight: bold; }
  .label.minor { font-size: 10px; color: rgba(220, 220, 210, 0.6); cursor: default; }
  .label.pin { font-size: 10px; color: #ff8a80; pointer-events: none; transform: translate(10px, -50%); }
  .marker {
    border: 1.5px solid var(--accent, #e74c3c); border-radius: 50%;
    box-shadow: 0 0 6px rgba(0, 0, 0, 0.6); pointer-events: none; opacity: 0.85;
  }
  .zodiac {
    font: 9px "JetBrains Mono", monospace; letter-spacing: 0.12em;
    color: rgba(255, 255, 255, 0.28); white-space: nowrap; pointer-events: none;
  }
  .zodiac.equinox { color: var(--accent, #e74c3c); opacity: 0.7; letter-spacing: 0.04em; }
  .grid { font: 9px "JetBrains Mono", monospace; color: rgba(255, 255, 255, 0.25); pointer-events: none; }
  .grid.equinox { color: var(--accent, #e74c3c); opacity: 0.75; }
  #legend {
    position: absolute; left: 12px; bottom: 10px; right: 12px;
    font-size: 11px; color: rgba(255, 255, 255, 0.4); pointer-events: none;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #fallback {
    position: absolute; inset: 0; display: flex; flex-direction: column; gap: 8px;
    align-items: center; justify-content: center; color: rgba(255, 255, 255, 0.7);
  }
  #fallback[hidden] { display: none; }
  #fallback small { opacity: 0.5; }
</style>
</head>
<body>
<div id="scene"></div>
<div id="legend"></div>
<div id="fallback" hidden>
  <div>The 3D view needs WebGL, and this system's web engine didn't provide it.</div>
  <div>Press <b>V</b> for the 2D map.</div>
  <small id="fallback-detail"></small>
</div>
<!-- served by Qt WebEngine; harmlessly missing in a plain browser -->
<script src="qrc:///qtwebchannel/qwebchannel.js"></script>
<script src="orrery3d.js"></script>
</body>
</html>
